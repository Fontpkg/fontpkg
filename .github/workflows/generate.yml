name: Generate font packages

on:
  workflow_dispatch:
    inputs:
      families:
        description: "Space-separated family slugs (e.g. roboto inter)"
        required: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --all-packages
      - run: uv run fontpkg-gen build ${{ inputs.families }} --out build --wheel
      - uses: actions/upload-artifact@v4
        with:
          name: font-wheels
          path: build/*/dist/*.whl
