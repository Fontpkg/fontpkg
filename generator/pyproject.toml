[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fontpkg-generator"
version = "0.1.0"
description = "Generates fontpkg-<family> packages from the google/fonts repository"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["fonttools>=4.50"]

[project.scripts]
fontpkg-gen = "fontpkg_generator.cli:main"

[dependency-groups]
dev = ["pytest>=8", "fontpkg"]

[tool.uv.sources]
fontpkg = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/fontpkg_generator"]
